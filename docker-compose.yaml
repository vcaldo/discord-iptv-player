services:
  remote-control:
    build:
      context: ./remote-control
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - remote-control/.env
    volumes:
      - ./playlists.yaml:/app/playlists.yaml
    depends_on:
      - postgres

  tv-player:
    build:
      context: ./tv-player2
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 5s
    stop_signal: SIGTERM
    init: true
    env_file:
      - tv-player2/.env
    depends_on:
      - postgres
      - remote-control
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17
    container_name: discord-iptv-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: discord_iptv_player
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discord_iptv_player"]
      interval: 10s
      timeout: 5s
      retries: 3

