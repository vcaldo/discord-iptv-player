services:
  remote-control:
    build:
      context: ./remote-control
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - remote-control/.env
    depends_on:
      - redis
      - tv-player

  tv-player:
    build:
      context: ./tv-player
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s # Increased to give more time for graceful shutdown
    stop_signal: SIGTERM # Explicitly set SIGTERM as the stop signal
    init: true # Use tini init system to properly handle signals
    env_file:
      - tv-player/.env
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4
    container_name: discord-iptv-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  newrelic-infra:
    container_name: newrelic-infra
    build:
      context: ./new-relic-infra
      dockerfile: Dockerfile
    cap_add:
      - SYS_PTRACE
    network_mode: bridge
    pid: host
    privileged: true
    volumes:
      - "/:/host:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: unless-stopped

volumes:
  redis-data:
